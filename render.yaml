services:
  - type: web
    name: wooofpay
    runtime: docker
    region: singapore
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4173
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_APPS_SCRIPT_WEBHOOK_URL
        sync: false
      # Public origin used to build the clobe OAuth redirect URI behind
      # Cloudflare. Without it the host is inferred from forwarded headers.
      - key: PUBLIC_BASE_URL
        value: https://pay.wooof.co.kr
      # Encrypts the stored clobe refresh token at rest. Must match the value
      # the token was sealed with — changing it forces a reconnect.
      - key: CLOBE_TOKEN_SECRET
        sync: false
      # Cafe24 Admin API. The secret authenticates the token endpoint over
      # HTTP Basic, so it must never live in the repo or the database.
      - key: CAFE24_MALL_ID
        sync: false
      - key: CAFE24_CLIENT_ID
        sync: false
      - key: CAFE24_CLIENT_SECRET
        sync: false
      # 기본은 읽기 전용. 주문 상태 쓰기를 켤 때만
      # mall.read_order,mall.write_order 로 바꾸고 재연결한다.
      - key: CAFE24_SCOPE
        sync: false
