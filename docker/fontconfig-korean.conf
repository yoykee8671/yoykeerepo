<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  거래 문서 엑셀은 맑은 고딕으로 지정돼 있지만, 리눅스 서버에는 그 폰트가
  없다(윈도 전용). 알리아스를 걸어두지 않으면 LibreOffice가 PDF로 변환할 때
  한글을 아무 폰트로나 대체해 자간·줄바꿈이 엑셀과 달라진다.
  나눔고딕은 자형 폭이 비슷해 레이아웃이 가장 적게 틀어진다.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="prepend" binding="same"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="prepend" binding="same"><string>NanumGothic</string></edit>
  </match>
</fontconfig>
