# v2 테스트 사이트 (v2.gnuol.com → 127.0.0.1:4174). 운영(4173, pay.gnuol.com)과 완전히 따로 돈다.
# DB 는 운영 복사본이며 클로브·카페24 토큰을 비워 둔다(운영 토큰이 갱신·폐기되지 않게).
# 올리기/다시 올리기: scripts/v2test-up.sh
name: wooofpay-v2test
services:
  db:
    image: postgres:17
    container_name: wooofpay-v2test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wooofpay
      POSTGRES_DB: wooofpay
      POSTGRES_PASSWORD: ${V2TEST_DB_PASSWORD:?set V2TEST_DB_PASSWORD}
    volumes:
      - wooofpay-v2test-db:/var/lib/postgresql/data
  app:
    build: ../..
    image: wooofpay-app:v2test
    container_name: wooofpay-v2test-app
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:4174:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      DATABASE_URL: postgres://wooofpay:${V2TEST_DB_PASSWORD}@db:5432/wooofpay
      PRODUCT_SYNC_SCHEDULE: "off"
      PUBLIC_BASE_URL: https://v2.gnuol.com
      CLOBE_TOKEN_SECRET: ${V2TEST_CLOBE_SECRET:?set V2TEST_CLOBE_SECRET}
volumes:
  wooofpay-v2test-db:
